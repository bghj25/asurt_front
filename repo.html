    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // =========================
            // CONFIG
            // =========================
            const API_BASE = 'http://localhost:8000/v1'; // swagger servers :contentReference[oaicite:6]{index=6}

            // =========================
            // Sidebar active link (оставляем)
            // =========================
            const links = document.querySelectorAll('.sidebar-link');
            const currentPage = window.location.pathname.split('/').pop() || 'repo.html';
            links.forEach(link => {
                if (link.getAttribute('href') === currentPage) link.classList.add('active');
                else link.classList.remove('active');
            });

            // =========================
            // Mobile menu toggle (оставляем)
            // =========================
            const mobileMenuButton = document.querySelector('.md\\:hidden button');
            const sidebar = document.querySelector('aside') || document.querySelector('.hidden.md\\:flex');
            if (mobileMenuButton && sidebar) {
                mobileMenuButton.addEventListener('click', function () {
                    sidebar.classList.toggle('hidden');
                });
            }

            // =========================
            // Helpers: auth + safe fetch
            // =========================
            function getAuthHeaders() {
                const token = localStorage.getItem('token');
                const tokenType = localStorage.getItem('token_type') || 'Bearer';
                if (!token) return {};
                return { 'Authorization': `${tokenType} ${token}` };
            }

            function getCurrentUserId() {
                try {
                    const user = JSON.parse(localStorage.getItem('user') || 'null');
                    return user && user.id ? user.id : null;
                } catch {
                    return null;
                }
            }

            async function apiRequest(path, options = {}) {
                const res = await fetch(`${API_BASE}${path}`, {
                    ...options,
                    headers: {
                        'Accept': 'application/json',
                        ...(options.headers || {}),
                        ...getAuthHeaders()
                    }
                });

                // если токен умер — уходим на main.html
                if (res.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('token_type');
                    localStorage.removeItem('user');
                    window.location.href = 'main.html';
                    return;
                }

                const text = await res.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch { data = null; }

                if (!res.ok) {
                    const msg = (data && (data.message || data.details || data.error)) || `HTTP ${res.status}`;
                    const err = new Error(msg);
                    err.status = res.status;
                    throw err;
                }

                return data;
            }

            function escapeHtml(str) {
                return String(str ?? '')
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#039;');
            }

            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '-';
                return d.toLocaleDateString('ru-RU');
            }

            // =========================
            // DOM refs (то что мы сделали в HTML шаге)
            // =========================
            const projectsList = document.getElementById('projects-list');
            const filterProject = document.getElementById('filterProject');
            const createProjectId = document.getElementById('createProjectId');
            const requirementsTbody = document.getElementById('requirementsTbody');
            const refreshContentHistoryBtn = document.getElementById('refresh-content-history-btn');
            const contentHistoryTbody = document.getElementById('contentHistoryTbody');

            // Фильтры статус/тип: в HTML они могли остаться без id,
            // поэтому делаем мягкий поиск по "Filters" блоку:
            const filtersRoot = document.querySelector('main'); // ок для прототипа
            const filterSelects = filtersRoot ? filtersRoot.querySelectorAll('select') : [];
            // Ожидание по макету repo.html: 3 select подряд (status, project, category/type)
            // project у нас уже точно по id, остальное — берём по позиции, но безопасно.
            const filterStatus = document.getElementById('filterStatus');
            const filterType = document.getElementById('filterType');

            // =========================
            // Load projects -> sidebar + selects
            // =========================
            let projectsCache = []; // чтобы маппить project_id -> name

            if (refreshContentHistoryBtn) {
                refreshContentHistoryBtn.addEventListener('click', () => {
                    if (!currentContentRequirementId) return;
                    loadContentHistory(currentContentRequirementId).catch(err => alert(err.message || err));
                });
            }

            function renderProjects(projects) {
                projectsCache = projects;

                // sidebar list
                if (projectsList) {
                    projectsList.innerHTML = '';
                    projects.forEach(p => {
                        const a = document.createElement('a');
                        a.href = '#';
                        a.className = 'flex items-center px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50';
                        a.dataset.projectId = p.id;

                        const dot = document.createElement('span');
                        dot.className = 'w-2 h-2 mr-3 rounded-full';
                        dot.style.backgroundColor = '#10B981'; // прототип
                        a.appendChild(dot);

                        a.insertAdjacentText('beforeend', ` ${p.name}`);
                        projectsList.appendChild(a);
                    });
                }

                // filter select
                if (filterProject) {
                    // оставляем первую опцию "Все проекты"
                    filterProject.innerHTML = '<option value="">Все проекты</option>';
                    projects.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name;
                        filterProject.appendChild(opt);
                    });
                }

                // create modal select
                if (createProjectId) {
                    createProjectId.innerHTML = '<option value="">Выберите проект</option>';
                    projects.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name;
                        createProjectId.appendChild(opt);
                    });
                }
            }

            async function loadProjects() {
                const userId = getCurrentUserId();
                if (!userId) {
                    // Это нормально, если логина ещё нет.
                    console.warn('No user in localStorage => cannot call /projects (needs user_id)');
                    renderProjects([]); // просто очистим списки
                    return;
                }

                // GET /projects?user_id=... :contentReference[oaicite:7]{index=7}
                const resp = await apiRequest(`/projects?user_id=${encodeURIComponent(userId)}`, { method: 'GET' });
                const projects = resp && Array.isArray(resp.data) ? resp.data : [];
                renderProjects(projects);
            }

            // =========================
            // Load requirements -> table (с фильтрами)
            // =========================
            function projectNameById(projectId) {
                const p = projectsCache.find(x => String(x.id) === String(projectId));
                return p ? p.name : `Project #${projectId}`;
            }

            function renderRequirements(items) {
                if (!requirementsTbody) return;

                requirementsTbody.innerHTML = '';

                // Таблица в HTML имеет 7 колонок:
                // ID | Название | Проект | Категория | Статус | Последнее обновление | Действия
                if (!items.length) {
                    requirementsTbody.innerHTML = `
      <tr>
        <td class="px-6 py-6 text-sm text-gray-500" colspan="7">Требований нет</td>
      </tr>
    `;
                    return;
                }

                items.forEach(r => {
                    const status = r.workflow?.status || '-';
                    const category = r.type || '-';
                    const updatedAt = formatDate(r.updated_at || r.created_at);
                    const projectName = projectNameById(r.project_id);

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 requirement-row';
                    tr.dataset.requirementId = r.id;

                    tr.innerHTML = `
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        ${escapeHtml(String(r.id))}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
        ${escapeHtml(r.name)}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        ${escapeHtml(projectName)}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        ${escapeHtml(category)}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        ${escapeHtml(status)}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        ${escapeHtml(updatedAt)}
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
        <button class="text-indigo-600 hover:text-indigo-900 mr-3" data-action="edit" data-id="${r.id}">
          <i class="fas fa-edit"></i>
        </button>
        <button class="text-red-600 hover:text-red-900" data-action="delete" data-id="${r.id}">
          <i class="fas fa-trash"></i>
        </button>
        <button class="text-gray-600 hover:text-gray-900 ml-3" data-action="content" data-id="${r.id}">
          <i class="fas fa-file-lines"></i>
        </button>
      </td>
    `;

                    requirementsTbody.appendChild(tr);
                });
            }


            function buildRequirementsQuery() {
                // GET /requirements supports: project_id, type, status, created_by, priority :contentReference[oaicite:9]{index=9}
                const params = new URLSearchParams();

                // project_id
                if (filterProject && filterProject.value) params.set('project_id', filterProject.value);

                // status (если select реально про статус)
                if (filterStatus && filterStatus.value && filterStatus.value !== 'all' && filterStatus.value !== '') {
                    // если в option стоят русские подписи — пока отправим value как есть
                    params.set('status', filterStatus.value);
                }

                // type (если select реально про тип)
                if (filterType && filterType.value && filterType.value !== 'all' && filterType.value !== '') {
                    params.set('type', filterType.value);
                }

                return params.toString() ? `?${params.toString()}` : '';
            }

            async function loadRequirements() {
                if (requirementsTbody) {
                    requirementsTbody.innerHTML = `
            <tr><td class="px-6 py-6 text-sm text-gray-500" colspan="7">Загрузка...</td></tr>
          `;
                }

                // GET /requirements :contentReference[oaicite:10]{index=10}
                const query = buildRequirementsQuery();
                const resp = await apiRequest(`/requirements${query}`, { method: 'GET' });
                const items = resp && Array.isArray(resp.data) ? resp.data : [];
                renderRequirements(items);
            }

            // =========================
            // Requirement content history (GET /requirements/{id}/content/history)
            // =========================
            let currentContentRequirementId = null;

            function renderContentHistory(items) {
                if (!contentHistoryTbody) return;

                contentHistoryTbody.innerHTML = '';

                if (!items || !items.length) {
                    contentHistoryTbody.innerHTML = `
      <tr>
        <td class="px-6 py-4 text-sm text-gray-500" colspan="3">Истории пока нет</td>
      </tr>
    `;
                    return;
                }

                items.forEach(h => {
                    const createdAt = formatDate(h.created_at);
                    const userId = h.created_by_user_id ?? '-';
                    const active = h.is_active ? 'Да' : 'Нет';

                    // Можно показать кусок description_text (если есть)
                    const desc = h.content?.description_text ? String(h.content.description_text) : '';
                    const shortDesc = desc.length > 80 ? desc.slice(0, 80) + '…' : desc;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
      <td class="px-6 py-3 text-sm text-gray-900">${escapeHtml(createdAt)}</td>
      <td class="px-6 py-3 text-sm text-gray-700">${escapeHtml(String(userId))}</td>
      <td class="px-6 py-3 text-sm text-gray-700">${escapeHtml(active)}</td>
      <td class="px-6 py-3 text-sm text-gray-500">${escapeHtml(shortDesc)}</td>
    `;
                    contentHistoryTbody.appendChild(tr);
                });
            }

            async function loadContentHistory(requirementId) {
                if (!requirementId) return;

                // GET /requirements/{requirement_id}/content/history?limit=10
                const resp = await apiRequest(`/requirements/${encodeURIComponent(requirementId)}/content/history?limit=10`, {
                    method: 'GET'
                });

                const items = resp && Array.isArray(resp.data) ? resp.data : [];
                renderContentHistory(items);
            }

            // =========================
            // Filters change -> reload (если есть)
            // =========================
            if (filterProject) filterProject.addEventListener('change', () => loadRequirements().catch(console.error));
            if (filterStatus) filterStatus.addEventListener('change', () => loadRequirements().catch(console.error));
            if (filterType) filterType.addEventListener('change', () => loadRequirements().catch(console.error));

            // =========================
            // Logout (оставляем)
            // =========================
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async function () {
                    const token = localStorage.getItem('token');
                    const tokenType = localStorage.getItem('token_type') || 'Bearer';

                    try {
                        // POST /auth/logout :contentReference[oaicite:11]{index=11}
                        await fetch(`${API_BASE}/auth/logout`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `${tokenType} ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });
                    } catch (e) {
                        console.warn('Logout request failed (backend not ready)');
                    } finally {
                        localStorage.removeItem('token');
                        localStorage.removeItem('token_type');
                        localStorage.removeItem('user');
                        window.location.href = 'main.html';
                    }
                });
            }
            // =========================
            // Delete requirement (DELETE /requirements/{id})
            // =========================
            if (requirementsTbody) {
                requirementsTbody.addEventListener('click', async (e) => {
                    const btn = e.target.closest('button[data-action="delete"]');
                    if (!btn) return;

                    e.preventDefault();
                    e.stopPropagation();

                    const id = btn.getAttribute('data-id');
                    if (!id) return;

                    const ok = confirm(`Удалить требование #${id}?`);
                    if (!ok) return;

                    try {
                        // DELETE /requirements/{requirement_id} :contentReference[oaicite:0]{index=0}
                        await apiRequest(`/requirements/${encodeURIComponent(id)}`, { method: 'DELETE' });

                        // перезагрузим список
                        await loadRequirements();
                    } catch (err) {
                        alert(`Ошибка удаления: ${err.message || err}`);
                    }
                });
            }


            // =========================
            // Edit requirement (PUT /requirements/{id})
            // =========================
            let editingRequirementId = null;

            const addRequirementModal = document.getElementById('add-requirement-modal');
            const saveRequirementBtn = document.getElementById('save-requirement-btn');
            const cancelRequirementBtn = document.getElementById('cancel-requirement-btn');

            const titleEl = document.getElementById('title');
            const descEl = document.getElementById('description');
            const projectEl = document.getElementById('createProjectId');
            const categoryEl = document.getElementById('category');

            const addRequirementBtn = document.getElementById('add-requirement-btn');

            if (addRequirementBtn) {
                addRequirementBtn.addEventListener('click', () => {
                    // режим "создание"
                    editingRequirementId = null;

                    // очистить поля (минимально)
                    if (titleEl) titleEl.value = '';
                    if (descEl) descEl.value = '';
                    if (projectEl) projectEl.value = '';
                    if (categoryEl) categoryEl.selectedIndex = 0;

                    openRequirementModal();
                });
            }

            function openRequirementModal() {
                if (addRequirementModal) addRequirementModal.classList.remove('hidden');
            }
            function closeRequirementModal() {
                if (addRequirementModal) addRequirementModal.classList.add('hidden');
                editingRequirementId = null;
            }

            // закрытие по кнопке "Отмена"
            if (cancelRequirementBtn) {
                cancelRequirementBtn.addEventListener('click', closeRequirementModal);
            }

            // закрытие по клику на серый фон
            if (addRequirementModal) {
                addRequirementModal.addEventListener('click', (e) => {
                    if (e.target === addRequirementModal) closeRequirementModal();
                });
            }

            // маппинг category -> type (swagger enum: functional, non-functional, business)
            function mapTypeFromCategory(v) {
                const s = String(v || '').toLowerCase();
                if (s.includes('функц')) return 'functional';
                if (s.includes('бизнес')) return 'business';
                if (s.includes('нефункц') || s.includes('non')) return 'non-functional';
                if (s === 'functional' || s === 'business' || s === 'non-functional') return s;
                return 'functional';
            }

            // клик по кнопке edit в таблице
            if (requirementsTbody) {
                requirementsTbody.addEventListener('click', async (e) => {
                    const btn = e.target.closest('button[data-action="edit"]');
                    if (!btn) return;

                    e.preventDefault();
                    e.stopPropagation();

                    const id = btn.getAttribute('data-id');
                    if (!id) return;

                    try {
                        // В swagger есть GET /requirements/{requirement_id} :contentReference[oaicite:0]{index=0}
                        // Берём полные данные и заполняем модалку
                        const r = await apiRequest(`/requirements/${encodeURIComponent(id)}`, { method: 'GET' });

                        editingRequirementId = id;

                        if (titleEl) titleEl.value = r?.name || '';
                        // description берём из content.description_text если есть, иначе пусто
                        if (descEl) descEl.value = r?.content?.description_text || r?.description_text || '';

                        if (projectEl) projectEl.value = String(r?.project_id ?? '');
                        if (categoryEl) categoryEl.value = r?.type || categoryEl.value;

                        openRequirementModal();
                    } catch (err) {
                        alert(`Не удалось открыть требование для редактирования: ${err.message || err}`);
                    }
                });
            }

            // переопределяем "Сохранить" для режима редактирования
            if (saveRequirementBtn) {
                saveRequirementBtn.addEventListener('click', async () => {

                    const name = titleEl ? titleEl.value.trim() : '';
                    const description = descEl ? descEl.value.trim() : '';
                    const projectIdRaw = projectEl ? projectEl.value : '';
                    const type = mapTypeFromCategory(categoryEl ? categoryEl.value : '');

                    if (!projectIdRaw) return alert('Выберите проект');
                    if (!name) return alert('Введите название');
                    if (!description) return alert('Введите описание');

                    const payload = {
                        project_id: Number(projectIdRaw),
                        name,
                        type,
                        // чтобы пройти любые варианты swagger
                        description_text: description,
                        content: { description_text: description }
                    };

                    try {
                        if (editingRequirementId) {
                            // PUT /requirements/{id}
                            await apiRequest(`/requirements/${encodeURIComponent(editingRequirementId)}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            alert('Требование обновлено');
                        } else {
                            // POST /requirements
                            await apiRequest('/requirements', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            alert('Требование создано');
                        }

                        closeRequirementModal();
                        await loadRequirements();
                    } catch (err) {
                        alert(`Ошибка сохранения: ${err.message || err}`);
                    }
                });
            }
            // =========================
            // Requirement content modal (GET /requirements/{id}/content)
            // =========================

            const contentModal = document.getElementById('requirement-content-modal');
            const contentTextarea = document.getElementById('requirementContentTextarea');
            const contentCloseBtn1 = document.getElementById('close-content-modal-btn');
            const contentCloseBtn2 = document.getElementById('close-content-modal-btn-2');




            function openContentModal() {
                if (contentModal) contentModal.classList.remove('hidden');

                // при открытии — сразу загрузим историю, если id уже известен
                if (currentContentRequirementId) {
                    if (contentHistoryTbody) {
                        contentHistoryTbody.innerHTML = `
        <tr><td class="px-4 py-3 text-sm text-gray-500" colspan="4">Загрузка...</td></tr>
      `;
                    }
                    loadContentHistory(currentContentRequirementId).catch(err => {
                        console.error(err);
                        if (contentHistoryTbody) {
                            contentHistoryTbody.innerHTML = `
          <tr><td class="px-4 py-3 text-sm text-red-600" colspan="4">Ошибка загрузки истории</td></tr>
        `;
                        }
                    });
                }
            }

            function closeContentModal() {
                if (contentModal) contentModal.classList.add('hidden');
                currentContentRequirementId = null;

                if (contentTextarea) contentTextarea.value = '';
                if (contentHistoryTbody) contentHistoryTbody.innerHTML = '';
            }

            // закрытие модалки
            if (contentCloseBtn1) contentCloseBtn1.addEventListener('click', closeContentModal);
            if (contentCloseBtn2) contentCloseBtn2.addEventListener('click', closeContentModal);

            // закрытие по клику на фон
            if (contentModal) {
                contentModal.addEventListener('click', (e) => {
                    if (e.target === contentModal) closeContentModal();
                });
            }

            async function loadRequirementContent(requirementId) {
                // GET /requirements/{requirement_id}/content :contentReference[oaicite:1]{index=1}
                const data = await apiRequest(`/requirements/${encodeURIComponent(requirementId)}/content`, {
                    method: 'GET'
                });

                // В swagger ответ = RequirementContent :contentReference[oaicite:2]{index=2}
                // Обычно там есть текстовое поле. На всякий случай поддержим разные варианты.
                const text =
                    data?.description_text ??
                    data?.content ??
                    data?.text ??
                    '';

                if (contentTextarea) contentTextarea.value = text;
            }
            function renderContentHistory(items) {
                if (!contentHistoryTbody) return;

                contentHistoryTbody.innerHTML = '';

                if (!items || !items.length) {
                    contentHistoryTbody.innerHTML = `
      <tr>
        <td class="px-4 py-3 text-sm text-gray-500" colspan="4">Истории пока нет</td>
      </tr>
    `;
                    return;
                }

                items.forEach(h => {
                    const createdAt = formatDate(h.created_at);
                    const userId = h.created_by_user_id ?? '-';
                    const active = h.is_active ? 'Да' : 'Нет';

                    const desc = h.content?.description_text ? String(h.content.description_text) : '';
                    const shortDesc = desc.length > 80 ? desc.slice(0, 80) + '…' : desc;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
      <td class="px-4 py-3 text-sm text-gray-900">${escapeHtml(createdAt)}</td>
      <td class="px-4 py-3 text-sm text-gray-700">${escapeHtml(String(userId))}</td>
      <td class="px-4 py-3 text-sm text-gray-700">${escapeHtml(active)}</td>
      <td class="px-4 py-3 text-sm text-gray-500">${escapeHtml(shortDesc)}</td>
    `;
                    contentHistoryTbody.appendChild(tr);
                });
            }

            async function loadContentHistory(requirementId) {
                if (!requirementId) return;

                // GET /requirements/{id}/content/history?limit=10
                const resp = await apiRequest(
                    `/requirements/${encodeURIComponent(requirementId)}/content/history?limit=10`,
                    { method: 'GET' }
                );

                const items = resp && Array.isArray(resp.data) ? resp.data : [];
                renderContentHistory(items);
            }
            // клик по кнопке "content" (иконка файла) в строке таблицы
            if (requirementsTbody) {
                requirementsTbody.addEventListener('click', async (e) => {
                    const btn = e.target.closest('button[data-action="content"]');
                    if (!btn) return;

                    e.preventDefault();
                    e.stopPropagation();

                    const id = btn.getAttribute('data-id');
                    if (!id) return;

                    try {
                        currentContentRequirementId = id;
                        openContentModal();

                        if (contentTextarea) contentTextarea.value = 'Загрузка...';
                        await loadRequirementContent(id);
                    } catch (err) {
                        alert(`Не удалось загрузить содержимое: ${err.message || err}`);
                        closeContentModal();
                    }
                });
            }

            // =========================
            // Save requirement content (PUT /requirements/{id}/content)
            // =========================
            const saveContentBtn = document.getElementById('save-content-btn');

            if (saveContentBtn) {
                saveContentBtn.addEventListener('click', async () => {
                    if (!currentContentRequirementId) {
                        alert('Не выбрано требование для сохранения содержимого');
                        return;
                    }

                    const text = contentTextarea ? contentTextarea.value : '';

                    try {
                        await apiRequest(
                            `/requirements/${encodeURIComponent(currentContentRequirementId)}/content`,
                            {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    description_text: text
                                })
                            }
                        );

                        alert('Содержимое требования сохранено');
                        closeContentModal();
                    } catch (err) {
                        alert(`Ошибка сохранения содержимого: ${err.message || err}`);
                    }
                });
            }
            // =========================
            // INIT
            // =========================
            Promise.resolve()
                .then(() => loadProjects())
                .then(() => loadRequirements())
                .catch(err => {
                    if (err && err.status === 403) alert('403: нет прав доступа');
                    else alert(`Ошибка: ${err.message || err}`);
                });

        });
    </script>

</body>

</html>
